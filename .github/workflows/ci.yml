name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run formatting

      - name: Lint JavaScript
        run: npm run lint

      - name: Lint CSS
        run: npm run stylelint

      - name: Run tests
        run: npm test

      - name: Smoke build
        run: npm run smoke:build

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: inex.ge-tweaks.user.js
          path: dist/inex.ge-tweaks.user.js
          if-no-files-found: error
          retention-days: 14
